version: 2

project_name: lognorth

before:
  hooks:
    - go mod tidy

# No binaries: LogNorth ships as an image, which release.yml builds. The
# `lognorth-linux-*` binaries of v0.28.1 and before were the older installer.
# Its servers update themselves from the newest lognorth-releases release;
# with no binary there, they keep the one they have and still pull the new
# image. Never attach a `lognorth-linux-*` binary again: one without
# `update` would end the nightly update of those servers.
builds:
  - skip: true

archives:
  - formats: [none]

checksum:
  disable: true

changelog:
  sort: asc
  use: github
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "^ci:"
      - Merge pull request
      - Merge branch
  groups:
    - title: Features
      regexp: '^.*?feat(\([[:word:]]+\))??!?:.+$'
      order: 0
    - title: Bug Fixes
      regexp: '^.*?fix(\([[:word:]]+\))??!?:.+$'
      order: 1
    - title: Others
      order: 999

release:
  github:
    owner: karloscodes
    name: lognorth
  prerelease: auto
  mode: replace
  header: |
    ## LogNorth {{ .Tag }}

    Self-hosted logging with error tracking.

    ### Installation

    ```bash
    curl -fsSL lognorth.com/install | sudo bash
    ```

  footer: |
    ---

    **Full Changelog**: https://github.com/karloscodes/lognorth/compare/{{ .PreviousTag }}...{{ .Tag }}
