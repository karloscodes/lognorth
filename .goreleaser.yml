version: 2

project_name: lognorth

before:
  hooks:
    - go mod tidy

builds:
  - id: lognorth
    main: ./cmd/lognorth
    binary: lognorth
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.Version={{.Version}}

archives:
  - id: binaries
    formats:
      - binary
    name_template: "{{ .Binary }}-{{ .Os }}-{{ .Arch }}"

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  use: github
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "^ci:"
      - Merge pull request
      - Merge branch
  groups:
    - title: Features
      regexp: '^.*?feat(\([[:word:]]+\))??!?:.+$'
      order: 0
    - title: Bug Fixes
      regexp: '^.*?fix(\([[:word:]]+\))??!?:.+$'
      order: 1
    - title: Others
      order: 999

release:
  github:
    owner: karloscodes
    name: lognorth
  prerelease: auto
  mode: replace
  header: |
    ## LogNorth {{ .Tag }}

    Self-hosted logging with error tracking.

    ### Installation

    ```bash
    curl -fsSL lognorth.com/install | sudo bash
    ```

    Or download directly:
    ```bash
    curl -L https://github.com/karloscodes/lognorth/releases/download/{{ .Tag }}/lognorth-linux-$(uname -m | sed 's/x86_64/amd64/' | sed 's/aarch64/arm64/') -o lognorth
    chmod +x lognorth
    ./lognorth
    ```
  footer: |
    ---

    **Full Changelog**: https://github.com/karloscodes/lognorth/compare/{{ .PreviousTag }}...{{ .Tag }}
