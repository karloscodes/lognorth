name: Test

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  # Fast: Go tests only (no SDK compatibility)
  # Always runs, even on forks
  go-tests:
    name: Go Tests
    runs-on: [self-hosted, Linux, X64, n100]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Run Go tests
        run: make test

  # Test that the installer actually works on a fresh Linux system
  install-test:
    name: Install Test
    runs-on: [self-hosted, Linux, X64, n100]
    if: github.repository == 'karloscodes/lognorth'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Build manager
        run: go build -o bin/lognorth ./cmd/manager

      - name: Build app image locally
        run: docker build --tag karloscodes/lognorth:latest .

      - name: Run install
        run: echo -e "localhost\ny\n" | sudo -E ./bin/lognorth install
        env:
          ENV: test
          LOGNORTH_PRIVATE_KEY: test-ci-key-not-real-do-not-use

      - name: Verify install
        run: |
          sleep 5
          docker ps
          docker ps --format '{{.Names}}' | grep -q "lognorth"
          for i in {1..12}; do
            curl -sf http://localhost/_health && exit 0
            sleep 5
          done
          exit 1

      - name: Logs on failure
        if: failure()
        run: |
          docker ps -a
          docker logs lognorth 2>&1 | tail -100 || true
          docker logs matcha-proxy 2>&1 | tail -50 || true

  # E2E tests with Playwright
  e2e-tests:
    name: E2E Tests
    runs-on: [self-hosted, Linux, X64, n100]
    if: github.repository == 'karloscodes/lognorth'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install web dependencies
        working-directory: web
        run: npm ci

      - name: Build web assets
        working-directory: web
        run: npm run build

      - name: Install e2e dependencies
        working-directory: e2e
        run: npm ci

      - name: Install Playwright browsers
        working-directory: e2e
        run: npx playwright install chromium --with-deps

      - name: Pre-build server for e2e
        run: go build -o tmp/lognorth-server cmd/lognorth/main.go

      - name: Run e2e tests
        working-directory: e2e
        run: npx playwright test
        env:
          CI: true

      - name: Upload test artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/test-results/
          retention-days: 7

  # Complete: All tests including SDK compatibility
  # Only runs on main repo (SDKs might be private)
  full-tests:
    name: Full Test Suite (with SDKs)
    runs-on: [self-hosted, Linux, X64, n100]
    if: github.repository == 'karloscodes/lognorth'
    defaults:
      run:
        working-directory: lognorth
    steps:
      - name: Checkout LogNorth
        uses: actions/checkout@v4
        with:
          path: lognorth

      - name: Checkout TypeScript SDK
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          repository: karloscodes/lognorth-sdk-ts
          path: lognorth-sdk-ts
          token: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}

      - name: Checkout Go SDK
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          repository: karloscodes/lognorth-sdk-go
          path: lognorth-sdk-go
          token: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}

      - name: Checkout Rails SDK
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          repository: karloscodes/lognorth-sdk-rails
          path: lognorth-sdk-rails
          token: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'

      - name: Run all tests
        run: make test-all
