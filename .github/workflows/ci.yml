name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

permissions:
  contents: read

jobs:
  # Fast: Go tests only (no SDK compatibility)
  # Always runs, even on forks
  go-tests:
    name: Go Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Build web assets
        working-directory: web
        run: npm ci && npm run build

      - name: Vet
        run: go vet ./...
      - name: Run Go tests
        run: go test -race ./...

  # E2E tests with Playwright
  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest
    if: github.repository == 'karloscodes/lognorth'
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Install web dependencies
        working-directory: web
        run: npm ci

      - name: Build web assets
        working-directory: web
        run: npm run build

      - name: Install e2e dependencies
        working-directory: e2e
        run: npm ci

      - name: Install Playwright browsers
        working-directory: e2e
        run: npx playwright install chromium --with-deps

      - name: Pre-build server for e2e
        run: go build -o tmp/lognorth-server cmd/lognorth/main.go

      - name: Run e2e tests
        working-directory: e2e
        run: npx playwright test
        env:
          CI: true

      - name: Upload test artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: e2e/test-results/
          retention-days: 7

  # Complete: All tests including SDK compatibility. The SDK repos are public.
  full-tests:
    name: Full Test Suite (with SDKs)
    runs-on: ubuntu-latest
    if: github.repository == 'karloscodes/lognorth'
    defaults:
      run:
        working-directory: lognorth
    steps:

      - name: Checkout LogNorth
        uses: actions/checkout@v7
        with:
          path: lognorth

      - name: Checkout TypeScript SDK
        uses: actions/checkout@v7
        with:
          repository: karloscodes/lognorth-sdk-ts
          path: lognorth-sdk-ts

      - name: Checkout Go SDK
        uses: actions/checkout@v7
        with:
          repository: karloscodes/lognorth-sdk-go
          path: lognorth-sdk-go

      - name: Checkout Rails SDK
        uses: actions/checkout@v7
        with:
          repository: karloscodes/lognorth-sdk-rails
          path: lognorth-sdk-rails

      - uses: actions/setup-go@v7
        with:
          go-version-file: lognorth/go.mod

      - uses: actions/setup-node@v7
        with:
          node-version: '20'

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'

      - name: Build web assets
        working-directory: lognorth/web
        run: npm ci && npm run build

      - name: Run all tests
        run: make test-all

  gosec:
    name: gosec
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # The app embeds the built web files. gosec only needs them to exist.
      - run: mkdir -p web/dist/assets web/dist/.vite && touch web/dist/assets/stub.txt && echo '{}' > web/dist/.vite/manifest.json
      - run: go run github.com/securego/gosec/v2/cmd/gosec@v2.29.0 -exclude-dir=e2e -exclude-dir=cmd/seed-demo -severity high -confidence high ./...

  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          # The go line names the patch. setup-go installs it, then sets
          # GOTOOLCHAIN=local. A bare "1.26" keeps the runner's cached patch.
          go-version-file: go.mod
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Scan the history for secrets
        run: |
          curl -sSfLO https://github.com/gitleaks/gitleaks/releases/download/v8.28.0/gitleaks_8.28.0_linux_x64.tar.gz
          echo "a65b5253807a68ac0cafa4414031fd740aeb55f54fb7e55f386acb52e6a840eb  gitleaks_8.28.0_linux_x64.tar.gz" | sha256sum -c -
          tar -xzf gitleaks_8.28.0_linux_x64.tar.gz gitleaks
          ./gitleaks git --redact --verbose .

  # The one check to require on main: it passes when every job above passed
  # (or was skipped on a fork).
  test:
    name: test
    if: always()
    needs: [go-tests, e2e-tests, full-tests, gosec, govulncheck, gitleaks]
    runs-on: ubuntu-latest
    steps:
      - run: |
          ! grep -qE "failure|cancelled" <<<"${{ join(needs.*.result, ' ') }}"
