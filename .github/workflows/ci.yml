name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # Fast: Go tests only (no SDK compatibility)
  # Always runs, even on forks
  go-tests:
    name: Go Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Build web assets
        working-directory: web
        run: npm ci && npm run build

      - name: Vet
        run: go vet ./...
      - name: Run Go tests
        run: go test -race ./...

  # E2E tests with Playwright
  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest
    if: github.repository == 'karloscodes/lognorth'
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Install web dependencies
        working-directory: web
        run: npm ci

      - name: Build web assets
        working-directory: web
        run: npm run build

      - name: Install e2e dependencies
        working-directory: e2e
        run: npm ci

      - name: Install Playwright browsers
        working-directory: e2e
        run: npx playwright install chromium --with-deps

      - name: Pre-build server for e2e
        run: go build -o tmp/lognorth-server cmd/lognorth/main.go

      - name: Run e2e tests
        working-directory: e2e
        run: npx playwright test
        env:
          CI: true

      - name: Upload test artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: e2e/test-results/
          retention-days: 7

  # Complete: All tests including SDK compatibility. The SDK repos are public.
  full-tests:
    name: Full Test Suite (with SDKs)
    runs-on: ubuntu-latest
    if: github.repository == 'karloscodes/lognorth'
    defaults:
      run:
        working-directory: lognorth
    steps:

      - name: Checkout LogNorth
        uses: actions/checkout@v7
        with:
          path: lognorth

      - name: Checkout TypeScript SDK
        uses: actions/checkout@v7
        with:
          repository: karloscodes/lognorth-sdk-ts
          path: lognorth-sdk-ts

      - name: Checkout Go SDK
        uses: actions/checkout@v7
        with:
          repository: karloscodes/lognorth-sdk-go
          path: lognorth-sdk-go

      - name: Checkout Rails SDK
        uses: actions/checkout@v7
        with:
          repository: karloscodes/lognorth-sdk-rails
          path: lognorth-sdk-rails

      - uses: actions/setup-go@v7
        with:
          go-version-file: lognorth/go.mod

      - uses: actions/setup-node@v7
        with:
          node-version: '20'

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'

      - name: Build web assets
        working-directory: lognorth/web
        run: npm ci && npm run build

      - name: Run all tests
        run: make test-all

  # The app embeds the built web files. The scans only need them to exist.
  security:
    uses: karloscodes/workflows/.github/workflows/go-security.yml@v1.1.0
    with:
      prepare: "mkdir -p web/dist/assets web/dist/.vite && touch web/dist/assets/stub.txt && echo '{}' > web/dist/.vite/manifest.json"
      gosec-flags: "-exclude-dir=e2e -exclude-dir=cmd/seed-demo"
      check-dockerfile: true

  gitleaks:
    uses: karloscodes/workflows/.github/workflows/gitleaks.yml@v1.1.0

  # The one check to require on main: it passes when every job above passed
  # (or was skipped on a fork).
  test:
    name: test
    if: always()
    needs: [go-tests, e2e-tests, full-tests, security, gitleaks]
    runs-on: ubuntu-latest
    steps:
      - run: |
          ! grep -qE "failure|cancelled" <<<"${{ join(needs.*.result, ' ') }}"
