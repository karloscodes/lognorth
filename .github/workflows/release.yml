name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

jobs:
  test:
    name: Run Tests
    runs-on: [self-hosted, Linux, X64, n100]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true

      - name: Install dependencies
        run: go mod download

      - name: Run tests
        run: go test -v ./...

  e2e-tests:
    name: E2E Tests
    runs-on: [self-hosted, Linux, X64, n100]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install web dependencies
        working-directory: web
        run: npm ci

      - name: Build web assets
        working-directory: web
        run: npm run build

      - name: Install e2e dependencies
        working-directory: e2e
        run: npm ci

      - name: Install Playwright browsers
        working-directory: e2e
        run: npx playwright install chromium --with-deps

      - name: Pre-build server for e2e
        run: go build -o tmp/lognorth-server cmd/lognorth/main.go

      - name: Run e2e tests
        working-directory: e2e
        run: npx playwright test
        env:
          CI: true

      - name: Upload test artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/test-results/
          retention-days: 7

  test-install:
    name: Test Install
    runs-on: [self-hosted, Linux, X64, n100]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true

      - name: Build manager binary
        run: |
          go build -o bin/lognorth ./cmd/manager
          chmod +x bin/lognorth

      - name: Build app image locally
        run: docker build --tag karloscodes/lognorth:latest .

      - name: Run install
        run: |
          echo -e "localhost\ny\n" | sudo -E ./bin/lognorth install
        env:
          ENV: test
          LOGNORTH_PRIVATE_KEY: test-ci-key-not-real-do-not-use

      - name: Verify containers running
        run: |
          sleep 5
          docker ps
          docker ps --format '{{.Names}}' | grep -q "lognorth" || (echo "Container not running" && exit 1)

      - name: Check health endpoint
        run: |
          for i in {1..12}; do
            if curl -sf http://localhost/_health; then
              echo "Health check passed"
              exit 0
            fi
            echo "Waiting for service (attempt $i/12)..."
            sleep 5
          done
          echo "Health check failed"
          docker logs lognorth || true
          exit 1

      - name: Collect logs on failure
        if: failure()
        run: |
          echo "=== Docker containers ==="
          docker ps -a
          echo "=== App logs ==="
          docker logs lognorth 2>&1 | tail -100 || true
          echo "=== Proxy logs ==="
          docker logs matcha-proxy 2>&1 | tail -50 || true

  release:
    name: Build and Release
    runs-on: [self-hosted, Linux, X64, n100]
    needs: [test, e2e-tests, test-install]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Get version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Build and push Docker images
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            karloscodes/lognorth:${{ steps.version.outputs.VERSION }}
            karloscodes/lognorth:latest
            ghcr.io/karloscodes/lognorth:${{ steps.version.outputs.VERSION }}
            ghcr.io/karloscodes/lognorth:latest

      - name: Publish to public releases repo
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"

          # Prepare binaries with correct names for installer
          cp ./dist/lognorth_linux_amd64_v1/lognorth ./dist/lognorth-linux-amd64
          cp ./dist/lognorth_linux_arm64_v8.0/lognorth ./dist/lognorth-linux-arm64

          # Update checksums with new filenames
          cd ./dist
          sha256sum lognorth-linux-amd64 lognorth-linux-arm64 > checksums.txt
          cd ..

          # Upload to public releases repo
          gh release create "v${VERSION}" \
            --repo karloscodes/lognorth-releases \
            --title "LogNorth v${VERSION}" \
            --notes "Release v${VERSION}" \
            ./dist/lognorth-linux-amd64 \
            ./dist/lognorth-linux-arm64 \
            ./dist/checksums.txt
