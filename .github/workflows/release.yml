name: Release

on:
  push:
    tags:
      - 'v*'
  # Release a tag by hand when its push started nothing, for example when the
  # tagged commit's message asks CI to skip: gh workflow run release.yml --ref v1.2.3
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  test:
    name: Run Tests (with SDKs)
    runs-on: [self-hosted, Linux, X64, n100]
    defaults:
      run:
        working-directory: lognorth
    steps:
      - name: Setup toolcache directory
        run: sudo mkdir -p /opt/hostedtoolcache && sudo chown -R $USER:$USER /opt/hostedtoolcache
        working-directory: /

      - name: Checkout LogNorth
        uses: actions/checkout@v7
        with:
          path: lognorth

      - name: Checkout TypeScript SDK
        uses: actions/checkout@v7
        continue-on-error: true
        with:
          repository: karloscodes/lognorth-sdk-ts
          path: lognorth-sdk-ts
          token: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}

      - name: Checkout Go SDK
        uses: actions/checkout@v7
        continue-on-error: true
        with:
          repository: karloscodes/lognorth-sdk-go
          path: lognorth-sdk-go
          token: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}

      - name: Checkout Rails SDK
        uses: actions/checkout@v7
        continue-on-error: true
        with:
          repository: karloscodes/lognorth-sdk-rails
          path: lognorth-sdk-rails
          token: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"

      - name: Build web assets
        working-directory: lognorth/web
        run: npm ci && npm run build

      - name: Run all tests
        run: make test-all

  e2e-tests:
    name: E2E Tests
    runs-on: [self-hosted, Linux, X64, n100]
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"

      - name: Install web dependencies
        working-directory: web
        run: npm ci

      - name: Build web assets
        working-directory: web
        run: npm run build

      - name: Install e2e dependencies
        working-directory: e2e
        run: npm ci

      - name: Install Playwright browsers
        working-directory: e2e
        run: npx playwright install chromium --with-deps

      - name: Pre-build server for e2e
        run: go build -o tmp/lognorth-server cmd/lognorth/main.go

      - name: Run e2e tests
        working-directory: e2e
        run: npx playwright test
        env:
          CI: true

      - name: Upload test artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: e2e/test-results/
          retention-days: 7

  # The install runs as root: it adds a cron job that starts the app again each
  # night, and binds ports 80 and 443. So it gets a fresh GitHub runner, never
  # the self-hosted one, where it stays behind and the next run finds it.
  test-install:
    name: Test Install
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Build manager binary
        run: |
          go build -o bin/lognorth ./cmd/manager
          chmod +x bin/lognorth

      - name: Build app image locally
        run: docker build --tag karloscodes/lognorth:latest .

      - name: Run install
        run: |
          echo -e "localhost\ny\n" | sudo -E ./bin/lognorth install
        env:
          ENV: test
          LOGNORTH_PRIVATE_KEY: test-ci-key-not-real-do-not-use

      - name: Verify containers running
        run: |
          sleep 5
          docker ps
          docker ps --format '{{.Names}}' | grep -q "lognorth" || (echo "Container not running" && exit 1)

      - name: Check health endpoint
        run: |
          for i in {1..12}; do
            if curl -sf http://localhost/_health; then
              echo "Health check passed"
              exit 0
            fi
            echo "Waiting for service (attempt $i/12)..."
            sleep 5
          done
          echo "Health check failed"
          docker logs lognorth || true
          exit 1

      - name: Collect logs on failure
        if: failure()
        run: |
          echo "=== Docker containers ==="
          docker ps -a
          echo "=== App logs ==="
          docker logs lognorth 2>&1 | tail -100 || true
          echo "=== Proxy logs ==="
          docker logs matcha-proxy 2>&1 | tail -50 || true

  # The install paths with Chasen, on GitHub's runners: see chasen.yml.
  chasen:
    uses: ./.github/workflows/chasen.yml

  release:
    name: Build and Release
    runs-on: [self-hosted, Linux, X64, n100]
    needs: [test, e2e-tests, test-install, chasen]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to DockerHub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # A tag with a hyphen (v0.26.0-rc.1) is a release candidate: it never moves
      # `latest`, which every install pulls at night, and its release is a prerelease.
      # It moves `rc` instead: the newest candidate, which your own server follows.
      - name: Get version from tag
        id: version
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          if [[ "$VERSION" == *-* ]]; then echo "RC=true" >> $GITHUB_OUTPUT; else echo "RC=false" >> $GITHUB_OUTPUT; fi

      - name: Build and push Docker images
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            karloscodes/lognorth:${{ steps.version.outputs.VERSION }}
            ghcr.io/karloscodes/lognorth-releases:${{ steps.version.outputs.VERSION }}
            ${{ steps.version.outputs.RC == 'false' && 'karloscodes/lognorth:latest' || '' }}
            ${{ steps.version.outputs.RC == 'false' && 'ghcr.io/karloscodes/lognorth-releases:latest' || '' }}
            ${{ steps.version.outputs.RC == 'true' && 'karloscodes/lognorth:rc' || '' }}
            ${{ steps.version.outputs.RC == 'true' && 'ghcr.io/karloscodes/lognorth-releases:rc' || '' }}
          # The image says its own version, so a tool that runs `latest` can name what runs.
          labels: |
            org.opencontainers.image.version=${{ steps.version.outputs.VERSION }}

      - name: Publish to public releases repo
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"

          # The binaries keep servers of the older installer updating. install.sh
          # is the install line: lognorth.com/install points to the newest one.
          # Prepare binaries with correct names for installer
          cp ./dist/lognorth_linux_amd64_v1/lognorth ./dist/lognorth-linux-amd64
          cp ./dist/lognorth_linux_arm64_v8.0/lognorth ./dist/lognorth-linux-arm64

          # Update checksums with new filenames
          cd ./dist
          sha256sum lognorth-linux-amd64 lognorth-linux-arm64 > checksums.txt
          cd ..

          # Upload to public releases repo
          PRERELEASE=""
          if [ "${{ steps.version.outputs.RC }}" = "true" ]; then PRERELEASE="--prerelease"; fi
          gh release create "v${VERSION}" $PRERELEASE \
            --repo karloscodes/lognorth-releases \
            --title "LogNorth v${VERSION}" \
            --notes "Release v${VERSION}" \
            ./dist/lognorth-linux-amd64 \
            ./dist/lognorth-linux-arm64 \
            ./dist/checksums.txt \
            ./install.sh
