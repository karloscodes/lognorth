name: Release

on:
  push:
    tags:
      - 'v*'
  # Release a tag by hand when its push started nothing, for example when the
  # tagged commit's message asks CI to skip: gh workflow run release.yml --ref v1.2.3
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  test:
    name: Run Tests (with SDKs)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lognorth
    steps:

      - name: Checkout LogNorth
        uses: actions/checkout@v7
        with:
          path: lognorth

      - name: Checkout TypeScript SDK
        uses: actions/checkout@v7
        with:
          repository: karloscodes/lognorth-sdk-ts
          path: lognorth-sdk-ts

      - name: Checkout Go SDK
        uses: actions/checkout@v7
        with:
          repository: karloscodes/lognorth-sdk-go
          path: lognorth-sdk-go

      - name: Checkout Rails SDK
        uses: actions/checkout@v7
        with:
          repository: karloscodes/lognorth-sdk-rails
          path: lognorth-sdk-rails

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          # Checkout lands in lognorth/. The path is from the workspace root.
          go-version-file: lognorth/go.mod
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"

      - name: Build web assets
        working-directory: lognorth/web
        run: npm ci && npm run build

      - name: Run all tests
        run: make test-all

  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"

      - name: Install web dependencies
        working-directory: web
        run: npm ci

      - name: Build web assets
        working-directory: web
        run: npm run build

      - name: Install e2e dependencies
        working-directory: e2e
        run: npm ci

      - name: Install Playwright browsers
        working-directory: e2e
        run: npx playwright install chromium --with-deps

      - name: Pre-build server for e2e
        run: go build -o tmp/lognorth-server cmd/lognorth/main.go

      - name: Run e2e tests
        working-directory: e2e
        run: npx playwright test
        env:
          CI: true

      - name: Upload test artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: e2e/test-results/
          retention-days: 7

  # The install paths with Chasen, on GitHub's runners: see chasen.yml.
  chasen:
    uses: ./.github/workflows/chasen.yml

  release:
    name: Build and Release
    runs-on: ubuntu-latest
    needs: [test, e2e-tests, chasen]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          # The patch on the go line, not a bare "1.26". setup-go then sets
          # GOTOOLCHAIN=local, so the runner's cached patch is what compiles.
          # This job checks the repo out at the workspace root, so the file
          # is go.mod. The test job checks it out into lognorth/.
          go-version-file: go.mod
          cache: true

      - name: Refuse an older Go than go.mod
        run: |
          set -euo pipefail
          # Same file the setup-go step just read: go.mod at the workspace
          # root. The test job checks the repo out into lognorth/, so its
          # copy is lognorth/go.mod. This job does not.
          #
          # setup-go installs a toolchain line when one is present, and the
          # go line otherwise, then sets GOTOOLCHAIN=local. A future line
          # such as "toolchain go1.26.11" next to "go 1.26.10" is the
          # compiler that ships, not the go line. v0.28.0 asked for "1.26",
          # the runner's cache answered 1.26.5, go.mod said go 1.26.0, and
          # that binary was published.
          #
          # The match is the whole version. go1.26.10 does not accept
          # go1.26.100 or go1.26.10rc1.
          mod=go.mod
          want=$(awk '
            /^toolchain go/ { print substr($2, 3); found = 1; exit }
            /^go / { v = $2 }
            END { if (!found) print v }
          ' "$mod")
          if [ -z "$want" ]; then
            echo "refusing to publish: no Go version in $mod"
            exit 1
          fi
          case "$want" in
            go*) expected="$want" ;;
            *) expected="go${want}" ;;
          esac
          have=$(go env GOVERSION)
          echo "go.mod wants ${expected}; this runner has ${have}"
          if [ -z "$have" ] || [ "$have" != "$expected" ]; then
            echo "refusing to publish: compiler is '${have}', want ${expected}"
            exit 1
          fi

      # GitHub's runners are amd64. QEMU builds the arm64 image.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to DockerHub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Pin the tag. GoReleaser's default sort (-version:refname) lists
          # v0.29.0-rc.7 ahead of v0.29.0 when both point at HEAD, so a
          # promoted candidate would build the binaries and the release of
          # the rc again. The same fix as Fusionaly #118 and Formlander.
          GORELEASER_CURRENT_TAG: ${{ github.ref_name }}

      # A tag with a hyphen (v0.26.0-rc.1) is a release candidate: it never moves
      # `latest`, which every install pulls at night, and its release is a prerelease.
      # It moves `rc` instead: the newest candidate, which your own server follows.
      - name: Get version from tag
        id: version
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          if [[ "$VERSION" == *-* ]]; then echo "RC=true" >> $GITHUB_OUTPUT; else echo "RC=false" >> $GITHUB_OUTPUT; fi

      - name: Build and push Docker images
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            karloscodes/lognorth:${{ steps.version.outputs.VERSION }}
            ghcr.io/karloscodes/lognorth-releases:${{ steps.version.outputs.VERSION }}
            ${{ steps.version.outputs.RC == 'false' && 'karloscodes/lognorth:latest' || '' }}
            ${{ steps.version.outputs.RC == 'false' && 'ghcr.io/karloscodes/lognorth-releases:latest' || '' }}
            ${{ steps.version.outputs.RC == 'true' && 'karloscodes/lognorth:rc' || '' }}
            ${{ steps.version.outputs.RC == 'true' && 'ghcr.io/karloscodes/lognorth-releases:rc' || '' }}
          # The image says its own version, so a tool that runs `latest` can name what runs.
          labels: |
            org.opencontainers.image.version=${{ steps.version.outputs.VERSION }}

      - name: Publish to public releases repo
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"

          # install.sh is the install line: lognorth.com/install points to the
          # newest one. No binary: see .goreleaser.yml.
          PRERELEASE=""
          if [ "${{ steps.version.outputs.RC }}" = "true" ]; then PRERELEASE="--prerelease"; fi
          gh release create "v${VERSION}" $PRERELEASE \
            --repo karloscodes/lognorth-releases \
            --title "LogNorth v${VERSION}" \
            --notes "Release v${VERSION}" \
            ./install.sh
