name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache: true

      - name: Install dependencies
        run: go mod download

      - name: Run tests
        run: go test -v ./...

  test-install:
    name: Test Install
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache: true

      - name: Build manager binary
        run: |
          go build -o bin/lognorth ./cmd/manager
          chmod +x bin/lognorth

      - name: Run install
        run: |
          echo -e "localhost\ny\n" | sudo -E ./bin/lognorth install
        env:
          ENV: test

      - name: Verify containers running
        run: |
          sleep 5
          docker ps
          docker ps --format '{{.Names}}' | grep -q "lognorth" || (echo "Container not running" && exit 1)

      - name: Check health endpoint
        run: |
          for i in {1..12}; do
            if curl -sf http://localhost/_health; then
              echo "Health check passed"
              exit 0
            fi
            echo "Waiting for service (attempt $i/12)..."
            sleep 5
          done
          echo "Health check failed"
          docker logs lognorth-app-1 || true
          exit 1

      - name: Collect logs on failure
        if: failure()
        run: |
          echo "=== Docker containers ==="
          docker ps -a
          echo "=== App logs ==="
          docker logs lognorth-app-1 2>&1 | tail -100 || true
          echo "=== Caddy logs ==="
          docker logs lognorth-caddy 2>&1 | tail -50 || true

  release:
    name: Build and Release
    runs-on: ubuntu-latest
    needs: [test]  # Note: test-install removed temporarily until first release exists in lognorth-releases
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Get version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Build and push Docker images
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            karloscodes/lognorth:${{ steps.version.outputs.VERSION }}
            karloscodes/lognorth:latest
            ghcr.io/karloscodes/lognorth:${{ steps.version.outputs.VERSION }}
            ghcr.io/karloscodes/lognorth:latest

      - name: Publish to public releases repo
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"

          # Prepare binaries with correct names for installer
          cp ./dist/lognorth_linux_amd64_v1/lognorth ./dist/lognorth-linux-amd64
          cp ./dist/lognorth_linux_arm64_v8.0/lognorth ./dist/lognorth-linux-arm64

          # Update checksums with new filenames
          cd ./dist
          sha256sum lognorth-linux-amd64 lognorth-linux-arm64 > checksums.txt
          cd ..

          # Upload to public releases repo
          gh release create "v${VERSION}" \
            --repo karloscodes/lognorth-releases \
            --title "LogNorth v${VERSION}" \
            --notes "Release v${VERSION}" \
            ./dist/lognorth-linux-amd64 \
            ./dist/lognorth-linux-arm64 \
            ./dist/checksums.txt
