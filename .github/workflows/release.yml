name: Release

on:
  push:
    tags:
      - 'v*'
  # Release candidate starts it for a tag it pushed: see release-candidate.yml.
  # A tag whose own workflow is older than this file is published from main:
  #   gh workflow run Release --ref main -f tag=v0.29.0
  # The first job resolves that tag to one commit. Later jobs check that
  # commit out, and GoReleaser is pinned to the tag name.
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release, for example v0.29.0. Empty: the tag this run was started on."
        required: false
        type: string

# Each job asks for what it needs. Only the jobs that publish can write.
permissions:
  contents: read

jobs:
  tag:
    name: Release tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      version: ${{ steps.resolve.outputs.version }}
      sha: ${{ steps.resolve.outputs.sha }}
      previous: ${{ steps.resolve.outputs.previous }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve the release tag
        id: resolve
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          tag="$RELEASE_TAG"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$ ]]; then
            echo "Release runs on vX.Y.Z or vX.Y.Z-rc.N, got: ${tag}" >&2
            exit 1
          fi
          # refs/tags/ only. A branch named vX.Y.Z must not pass.
          tagged="$(git rev-parse --verify "refs/tags/${tag}^{commit}")"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          # The image tags have no v: karloscodes/lognorth:0.29.0.
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
          echo "sha=${tagged}" >> "$GITHUB_OUTPUT"

          # An rc: GoReleaser finds the previous tag itself.
          if [[ "$tag" == *-* ]]; then
            exit 0
          fi

          # The list holds this tag, so any other highest tag is above it.
          stables="$(git tag --list 'v[0-9]*' --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$')"
          highest="$(printf '%s\n' "$stables" | head -1)"
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ "$tag" != "$highest" ]; then
            echo "Refusing ${tag}: ${highest} is the newest stable tag, and ${tag} would move latest back." >&2
            exit 1
          fi
          previous="$(printf '%s\n' "$stables" | awk -v cur="$tag" '$0 == cur { found = 1; next } found { print; exit }')"
          if [ -z "$previous" ]; then
            echo "No stable tag before ${tag}." >&2
            exit 1
          fi
          echo "previous=${previous}" >> "$GITHUB_OUTPUT"

  test:
    name: Run Tests (with SDKs)
    runs-on: ubuntu-latest
    needs: tag
    defaults:
      run:
        working-directory: lognorth
    steps:

      - name: Checkout LogNorth
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.tag.outputs.sha }}
          path: lognorth

      - name: Checkout TypeScript SDK
        uses: actions/checkout@v7
        with:
          repository: karloscodes/lognorth-sdk-ts
          path: lognorth-sdk-ts

      - name: Checkout Go SDK
        uses: actions/checkout@v7
        with:
          repository: karloscodes/lognorth-sdk-go
          path: lognorth-sdk-go

      - name: Checkout Rails SDK
        uses: actions/checkout@v7
        with:
          repository: karloscodes/lognorth-sdk-rails
          path: lognorth-sdk-rails

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          # Checkout lands in lognorth/. The path is from the workspace root.
          go-version-file: lognorth/go.mod
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"

      - name: Build web assets
        working-directory: lognorth/web
        run: npm ci && npm run build

      - name: Run all tests
        run: make test-all

  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: tag
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.tag.outputs.sha }}

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"

      - name: Install web dependencies
        working-directory: web
        run: npm ci

      - name: Build web assets
        working-directory: web
        run: npm run build

      - name: Install e2e dependencies
        working-directory: e2e
        run: npm ci

      - name: Install Playwright browsers
        working-directory: e2e
        run: npx playwright install chromium --with-deps

      - name: Pre-build server for e2e
        run: go build -o tmp/lognorth-server cmd/lognorth/main.go

      - name: Run e2e tests
        working-directory: e2e
        run: npx playwright test
        env:
          CI: true

      - name: Upload test artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: e2e/test-results/
          retention-days: 7

  # The install paths with Chasen: see chasen.yml. The commit the tag job
  # resolved, not the ref this workflow was started on.
  chasen:
    needs: tag
    uses: ./.github/workflows/chasen.yml
    with:
      ref: ${{ needs.tag.outputs.sha }}

  release:
    name: Build and Release
    runs-on: ubuntu-latest
    needs: [tag, test, e2e-tests, chasen]
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.tag.outputs.sha }}
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # The installed Go must be the go line in go.mod, and the image tag
      # must name that same release. A future toolchain line must be kept
      # in sync: setup-go installs it instead of the go line.
      - name: Check the release Go
        run: |
          set -euo pipefail
          mod="$(awk '$1 == "go" { print $2; exit }' go.mod)"
          got="$(go env GOVERSION)"
          if [ -z "${mod}" ] || [ -z "${got}" ] || [ "${got}" != "go${mod}" ]; then
            echo "go env GOVERSION is '${got:-}', want go${mod:-}"
            exit 1
          fi
          tag="$(awk '$1 == "FROM" && $2 ~ /^golang:/ { sub(/^golang:/, "", $2); print $2; exit }' Dockerfile)"
          ver="${tag%%-*}"
          if [ -z "${ver}" ] || [ "${ver}" != "${mod}" ]; then
            echo "Dockerfile FROM golang:${tag:-} does not match go ${mod}"
            exit 1
          fi
          echo "Release Go is ${got}; image is golang:${tag}"

      # GitHub's runners are amd64. QEMU builds the arm64 image.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to DockerHub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # A tag with a hyphen (v0.26.0-rc.1) is a release candidate: it never moves
      # `latest`, which every install pulls at night, and its release is a prerelease.
      # It moves `rc` instead: the newest candidate, which your own server follows.
      - name: Get version from tag
        id: version
        env:
          VERSION: ${{ needs.tag.outputs.version }}
        run: |
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"
          if [[ "$VERSION" == *-* ]]; then echo "RC=true" >> "$GITHUB_OUTPUT"; else echo "RC=false" >> "$GITHUB_OUTPUT"; fi

      - name: Build and push Docker images
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            karloscodes/lognorth:${{ steps.version.outputs.VERSION }}
            ghcr.io/karloscodes/lognorth:${{ steps.version.outputs.VERSION }}
            ghcr.io/karloscodes/lognorth-releases:${{ steps.version.outputs.VERSION }}
            ${{ steps.version.outputs.RC == 'false' && 'karloscodes/lognorth:latest' || '' }}
            ${{ steps.version.outputs.RC == 'false' && 'ghcr.io/karloscodes/lognorth:latest' || '' }}
            ${{ steps.version.outputs.RC == 'false' && 'ghcr.io/karloscodes/lognorth-releases:latest' || '' }}
            ${{ steps.version.outputs.RC == 'true' && 'karloscodes/lognorth:rc' || '' }}
            ${{ steps.version.outputs.RC == 'true' && 'ghcr.io/karloscodes/lognorth:rc' || '' }}
            ${{ steps.version.outputs.RC == 'true' && 'ghcr.io/karloscodes/lognorth-releases:rc' || '' }}
          # The image says its own version, so a tool that runs `latest` can name what runs.
          labels: |
            org.opencontainers.image.version=${{ steps.version.outputs.VERSION }}

      # After the image: a public release always has its image, and
      # releases/latest never points at a version nobody can pull yet.
      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Pin the tag. GoReleaser's default sort (-version:refname) lists
          # v0.29.0-rc.7 ahead of v0.29.0 when both point at HEAD, and
          # prerelease: auto then follows that rc tag. Stable notes start at
          # the previous stable tag, not at the rc that shares this commit.
          GORELEASER_CURRENT_TAG: ${{ needs.tag.outputs.tag }}
          GORELEASER_PREVIOUS_TAG: ${{ needs.tag.outputs.previous }}

      - name: Publish to public releases repo
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          VERSION: ${{ steps.version.outputs.VERSION }}
          RC: ${{ steps.version.outputs.RC }}
        run: |
          # install.sh is the install line: lognorth.com/install points to the
          # newest one here. GoReleaser attaches it from the tag's settings, and a
          # rebuild of an older tag has older settings, so attach it here too.
          gh release upload "v${VERSION}" ./install.sh --clobber --repo karloscodes/lognorth
          # lognorth-releases stays a mirror: see CLAUDE.md. No binary: see
          # .goreleaser.yml.
          PRERELEASE=""
          if [ "$RC" = "true" ]; then PRERELEASE="--prerelease"; fi
          # A rerun of a tag finds it there already.
          gh release view "v${VERSION}" --repo karloscodes/lognorth-releases >/dev/null 2>&1 && exit 0
          gh release create "v${VERSION}" $PRERELEASE \
            --repo karloscodes/lognorth-releases \
            --title "LogNorth v${VERSION}" \
            --notes "Release v${VERSION}" \
            ./install.sh

  scan:
    name: Scan the release image
    runs-on: ubuntu-latest
    needs: [tag, release]
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Scan Docker image for vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: 'karloscodes/lognorth:${{ needs.tag.outputs.version }}'
          format: 'sarif'
          output: 'trivy-docker-results.sarif'
        continue-on-error: true

      - name: Upload Docker scan results
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: 'trivy-docker-results.sarif'
        continue-on-error: true
